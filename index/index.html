<html lang="zh-CN">
<head>
	<meta charset="utf-8">

     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f5ef">
	<title>NCM 转 MP3</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #f4f5ef;
			--ink: #17231e;
			--muted: #66736b;
			--line: #d7ddd5;
			--green: #c5ec54;
			--green-dark: #203b2f;
			--coral: #f1745d;
			--white: #fffefa;
			font-family: "Aptos", "Microsoft YaHei UI", sans-serif;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background-color: var(--paper);
			background-image: radial-gradient(#cbd3c8 0.7px, transparent 0.7px);
			background-size: 18px 18px;
		}

		button, input { font: inherit; }

		.page {
			width: min(100% - 40px, 860px);
			margin: 0 auto;
			padding: 36px 0 56px;
		}

		.topline {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding-bottom: 18px;
			border-bottom: 1px solid var(--line);
			color: var(--muted);
			font-size: 13px;
		}

		.brand { color: var(--ink); font-weight: 800; letter-spacing: 0.04em; }
		.local-note { display: inline-flex; align-items: center; gap: 8px; }
		.local-note::before { width: 8px; height: 8px; border-radius: 50%; background: #58886d; content: ""; }

		main { padding-top: clamp(32px, 8vh, 70px); }

		.eyebrow {
			margin: 0 0 12px;
			color: #587362;
			font-size: 12px;
			font-weight: 800;
			letter-spacing: 0.13em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			font-family: Georgia, "Songti SC", serif;
			font-size: clamp(42px, 8vw, 76px);
			font-weight: 500;
			line-height: 1.04;
		}

		h1 span { color: #65804d; font-style: italic; }

		.intro {
			max-width: 510px;
			margin: 18px 0 34px;
			color: var(--muted);
			font-size: 15px;
			line-height: 1.8;
		}

		.dropzone {
			display: grid;
			min-height: 230px;
			place-items: center;
			padding: 28px;
			border: 1.5px dashed #85988a;
			border-radius: 5px;
			background: rgb(255 254 250 / 78%);
			text-align: center;
			transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
		}

		.dropzone.is-over {
			transform: translateY(-2px);
			border-color: var(--green-dark);
			background: #f0f7de;
		}

		.drop-mark {
			display: grid;
			width: 52px;
			height: 52px;
			margin: 0 auto 15px;
			place-items: center;
			border-radius: 50%;
			background: var(--green);
			color: var(--green-dark);
			font-size: 25px;
			font-weight: 500;
		}

		.drop-title { margin: 0; font-size: 18px; font-weight: 750; }
		.drop-hint { margin: 8px 0 17px; color: var(--muted); font-size: 13px; }

		.choose-button {
			min-height: 42px;
			padding: 0 18px;
			border: 0;
			border-radius: 3px;
			background: var(--green-dark);
			color: white;
			cursor: pointer;
			font-size: 14px;
			font-weight: 700;
		}

		.choose-button:hover { background: #315642; }
		.choose-button:focus-visible, .remove-button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
		#file-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }

		.queue-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin: 30px 0 10px;
		}

		h2 { margin: 0; font-size: 14px; font-weight: 800; }
		.summary { color: var(--muted); font-size: 12px; }

		.file-list { margin: 0; padding: 0; list-style: none; }

		.file-row {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto auto;
			align-items: center;
			gap: 16px;
			min-height: 62px;
			padding: 10px 2px;
			border-top: 1px solid var(--line);
			animation: arrive 220ms ease both;
		}

		@keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

		.file-name { overflow: hidden; font-size: 14px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
		.file-size { margin-top: 4px; color: var(--muted); font-size: 11px; }
		.file-status { color: var(--muted); font-size: 12px; white-space: nowrap; }
		.file-status[data-state="success"] { color: #386d4e; }
		.file-status[data-state="error"] { color: #b44837; }

		.remove-button {
			width: 32px;
			height: 32px;
			border: 0;
			border-radius: 3px;
			background: transparent;
			color: var(--muted);
			cursor: pointer;
			font-size: 20px;
		}

		.remove-button:hover { background: #e9ece5; color: var(--ink); }
		.empty-state { padding: 20px 2px; border-top: 1px solid var(--line); color: #7a857d; font-size: 13px; }

		footer {
			display: flex;
			justify-content: space-between;
			gap: 16px;
			margin-top: 38px;
			padding-top: 15px;
			border-top: 1px solid var(--line);
			color: var(--muted);
			font-size: 11px;
			line-height: 1.6;
		}

		.support {
			width: min(100% - 40px, 860px);
			margin: 12px auto 48px;
			padding: 30px;
			border-top: 2px solid var(--green-dark);
			background: var(--white);
			text-align: center;
		}

		.support h2 {
			font-family: Georgia, "Songti SC", serif;
			font-size: 25px;
			font-weight: 500;
		}

		.support-copy {
			max-width: 650px;
			margin: 12px auto 25px;
			color: var(--muted);
			font-size: 14px;
			line-height: 1.9;
		}

		.payment-codes {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			justify-items: center;
			gap: 22px;
		}

		.payment-option { width: min(100%, 400px); margin: 0; }
		.payment-option figcaption { margin-bottom: 10px; font-size: 14px; font-weight: 750; }
		.payment-option img { display: block; width: 100%; height: auto; border: 1px solid var(--line); }

		@media (max-width: 560px) {
			.page { width: min(100% - 28px, 860px); padding-top: 20px; }
			main { padding-top: 42px; }
			.intro { margin-bottom: 25px; }
			.dropzone { min-height: 210px; padding: 22px 14px; }
			.file-row { grid-template-columns: minmax(0, 1fr) auto 30px; gap: 8px; }
			footer { flex-direction: column; gap: 4px; }
			.support { width: min(100% - 28px, 860px); margin-bottom: 28px; padding: 24px 16px; }
			.support h2 { font-size: 22px; }
			.payment-codes { grid-template-columns: minmax(0, 1fr); gap: 24px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<div class="page">
		<header class="topline">
			<div class="brand">LOCAL AUDIO TOOL</div>
			<div class="local-note">文件仅在本机处理</div>
		</header>

		<main>
			<p class="eyebrow">Netease Cloud Music · File converter</p>
			<h1>NCM <span>to</span> MP3</h1>
			<p class="intro">把 NCM 歌曲还原为 MP3。支持一次处理多个文件，歌曲标题、专辑和艺人信息会一并写入音频。</p>

			<section class="dropzone" id="dropzone" aria-label="NCM 文件拖放区域">
				<div>
					<div class="drop-mark" aria-hidden="true">↓</div>
					<p class="drop-title">拖放 .ncm 文件到这里</p>
					<p class="drop-hint">也可以从设备中选择一个或多个文件</p>
					<button class="choose-button" id="choose-button" type="button">选择 NCM 文件</button>
					<input id="file-input" type="file" accept=".ncm,audio/*" multiple aria-label="选择 NCM 文件">
				</div>
			</section>

			<section aria-labelledby="queue-title">
				<div class="queue-head">
					<h2 id="queue-title">转换列表</h2>
					<div class="summary" id="summary" aria-live="polite">等待添加文件</div>
				</div>
				<ul class="file-list" id="file-list" aria-live="polite">
					<li class="empty-state" id="empty-state">文件会显示在这里</li>
				</ul>
			</section>
		</main>

		<footer>
			<span>无需安装 · 无需上传 · 支持批量转换</span>
			<span>转换结果由浏览器下载，保存位置由浏览器设置决定</span>
		</footer>
	</div>

	<script>
		const fileInput = document.querySelector("#file-input");
		const chooseButton = document.querySelector("#choose-button");
		const dropzone = document.querySelector("#dropzone");
		const fileList = document.querySelector("#file-list");
		const summary = document.querySelector("#summary");
		const jobs = new Map();
		let nextJobId = 0;
		let isConverting = false;

		chooseButton.addEventListener("click", () => fileInput.click());
		fileInput.addEventListener("change", () => {
			addFiles(fileInput.files);
			fileInput.value = "";
		});

		for (const eventName of ["dragenter", "dragover"]) {
			dropzone.addEventListener(eventName, (event) => {
				event.preventDefault();
				dropzone.classList.add("is-over");
			});
		}

		for (const eventName of ["dragleave", "drop"]) {
			dropzone.addEventListener(eventName, (event) => {
				event.preventDefault();
				dropzone.classList.remove("is-over");
			});
		}

		dropzone.addEventListener("drop", (event) => addFiles(event.dataTransfer.files));

		function addFiles(fileCollection) {
			const files = Array.from(fileCollection).filter((file) => file.name.toLowerCase().endsWith(".ncm"));
			for (const file of files) {
				const id = ++nextJobId;
				const row = document.createElement("li");
				row.className = "file-row";
				row.innerHTML = '<div><div class="file-name"></div><div class="file-size"></div></div><div class="file-status" role="status">等待转换</div><button class="remove-button" type="button" aria-label="移除文件" title="移除文件">×</button>';
				row.querySelector(".file-name").textContent = file.name;
				row.querySelector(".file-size").textContent = formatSize(file.size);
				row.querySelector(".remove-button").addEventListener("click", () => {
					if (jobs.get(id)?.state !== "processing") {
						jobs.delete(id);
						row.remove();
						updateSummary();
						showEmptyState();
					}
				});
				fileList.querySelector(".empty-state")?.remove();
				fileList.append(row);
				jobs.set(id, { file, row, state: "pending" });
			}
			updateSummary();
			processQueue();
		}

		async function processQueue() {
			if (isConverting) return;
			isConverting = true;
			for (const [id, job] of jobs) {
				if (job.state !== "pending") continue;
				setJobState(id, "processing", "正在解密…");
				try {
					const output = await convertNcm(job.file);
					downloadFile(output, job.file.name.replace(/\.ncm$/i, ".mp3"));
					setJobState(id, "success", "已导出");
				} catch (error) {
					setJobState(id, "error", error instanceof Error ? error.message : "转换失败");
				}
			}
			isConverting = false;
			updateSummary();
			showEmptyState();
		}

		function setJobState(id, state, message) {
			const job = jobs.get(id);
			if (!job) return;
			job.state = state;
			const status = job.row.querySelector(".file-status");
			status.dataset.state = state === "success" ? "success" : state === "error" ? "error" : "";
			status.textContent = message;
			const removeButton = job.row.querySelector(".remove-button");
			removeButton.disabled = state === "processing";
			removeButton.title = state === "processing" ? "文件正在转换" : "移除文件";
			updateSummary();
		}

		function updateSummary() {
			const items = Array.from(jobs.values());
			const done = items.filter((job) => job.state === "success").length;
			const failed = items.filter((job) => job.state === "error").length;
			const pending = items.filter((job) => job.state === "pending" || job.state === "processing").length;
			summary.textContent = items.length ? `${items.length} 个文件 · ${done} 个完成${failed ? ` · ${failed} 个失败` : ""}${pending ? ` · ${pending} 个处理中` : ""}` : "等待添加文件";
		}

		function showEmptyState() {
			if (jobs.size === 0 && !fileList.querySelector(".empty-state")) {
				const empty = document.createElement("li");
				empty.className = "empty-state";
				empty.textContent = "文件会显示在这里";
				fileList.append(empty);
			}
		}

		function formatSize(size) {
			if (size < 1024) return `${size} B`;
			if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
			return `${(size / (1024 * 1024)).toFixed(1)} MB`;
		}

		async function convertNcm(file) {
			const bytes = new Uint8Array(await file.arrayBuffer());
			let offset = 0;
			const ensureAvailable = (length) => {
				if (length < 0 || offset + length > bytes.length) throw new Error("文件已损坏或格式不完整");
			};
			const readUint32 = () => {
				ensureAvailable(4);
				const value = new DataView(bytes.buffer, bytes.byteOffset + offset, 4).getUint32(0, true);
				offset += 4;
				return value;
			};

			const magic = "CTENFDAM";
			ensureAvailable(10);
			for (let index = 0; index < magic.length; index++) {
				if (bytes[index] !== magic.charCodeAt(index)) throw new Error("不是有效的 NCM 文件");
			}
			offset = 10;

			const keyLength = readUint32();
			ensureAvailable(keyLength);
			const encryptedKey = bytes.slice(offset, offset + keyLength);
			offset += keyLength;
			for (let index = 0; index < encryptedKey.length; index++) encryptedKey[index] ^= 0x64;
			const decodedKey = await aesEcbDecrypt(encryptedKey, hexBytes("687A4852416D736F356B496E62617857"));
			const musicKey = decodedKey.slice(17);
			if (!musicKey.length) throw new Error("无法读取歌曲密钥");

			const metadataLength = readUint32();
			ensureAvailable(metadataLength);
			const metadataBytes = bytes.slice(offset, offset + metadataLength);
			offset += metadataLength;
			let metadata = null;
			let identifier = "";
			if (metadataLength) {
				for (let index = 0; index < metadataBytes.length; index++) metadataBytes[index] ^= 0x63;
				const metadataText = new TextDecoder().decode(metadataBytes);
				identifier = metadataText;
				try {
					const encoded = metadataText.slice(22);
					const binary = atob(encoded);
					const encryptedMetadata = Uint8Array.from(binary, (character) => character.charCodeAt(0));
					const plainMetadata = await aesEcbDecrypt(encryptedMetadata, hexBytes("2331346C6A6B5F215C5D2630553C2728"));
					const jsonText = new TextDecoder().decode(plainMetadata).replace(/\0+$/, "").slice(6);
					metadata = JSON.parse(jsonText);
				} catch {
					metadata = null;
				}
			}

			ensureAvailable(5);
			offset += 5;
			const imageSpace = readUint32();
			const imageSize = readUint32();
			if (imageSize > imageSpace) throw new Error("封面数据格式异常");
			ensureAvailable(imageSpace);
			const image = imageSize ? bytes.slice(offset, offset + imageSize) : null;
			offset += imageSpace;

			const encryptedAudio = bytes.subarray(offset);
			if (!encryptedAudio.length) throw new Error("文件中没有音频数据");
			const audio = decryptAudio(encryptedAudio, musicKey);
			const taggedAudio = metadata?.format === "mp3" ? makeTaggedMp3(audio, metadata, identifier, image) : audio;
			return new Blob([taggedAudio], { type: "audio/mpeg" });
		}

		async function aesEcbDecrypt(ciphertext, keyBytes) {
			if (ciphertext.length === 0 || ciphertext.length % 16 !== 0) throw new Error("NCM 密钥数据格式异常");
			const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-CBC" }, false, ["encrypt", "decrypt"]);
			const blockSize = 16;
			const lastBlock = ciphertext.subarray(ciphertext.length - blockSize);
			const padBlock = new Uint8Array(blockSize).fill(blockSize);
			const bridgePlaintext = new Uint8Array(blockSize);
			for (let index = 0; index < blockSize; index++) bridgePlaintext[index] = padBlock[index] ^ lastBlock[index];
			const zeroIv = new Uint8Array(blockSize);
			const bridgeCiphertext = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-CBC", iv: zeroIv }, key, bridgePlaintext));
			const joined = new Uint8Array(ciphertext.length + blockSize);
			joined.set(ciphertext);
			joined.set(bridgeCiphertext.subarray(0, blockSize), ciphertext.length);
			const cbcPlaintext = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-CBC", iv: zeroIv }, key, joined));

			const plaintext = cbcPlaintext.slice();
			for (let offset = blockSize; offset < plaintext.length; offset += blockSize) {
				for (let index = 0; index < blockSize; index++) plaintext[offset + index] ^= ciphertext[offset - blockSize + index];
			}
			let padding = plaintext[plaintext.length - 1];
			if (padding > 0 && padding <= blockSize && plaintext.subarray(plaintext.length - padding).every((byte) => byte === padding)) {
				return plaintext.slice(0, plaintext.length - padding);
			}
			return plaintext;
		}

		function decryptAudio(encrypted, key) {
			const box = Uint8Array.from({ length: 256 }, (_, index) => index);
			let cursor = 0;
			for (let index = 0; index < 256; index++) {
				cursor = (cursor + box[index] + key[index % key.length]) & 0xff;
				[box[index], box[cursor]] = [box[cursor], box[index]];
			}
			const stream = new Uint8Array(256);
			for (let index = 0; index < 256; index++) stream[index] = box[(box[index] + box[(index + box[index]) & 0xff]) & 0xff];
			const output = new Uint8Array(encrypted.length);
			for (let index = 0; index < encrypted.length; index++) output[index] = encrypted[index] ^ stream[(index + 1) & 0xff];
			return output;
		}

		function makeTaggedMp3(audio, metadata, identifier, image) {
			const frames = [];
			const addTextFrame = (id, value) => {
				if (typeof value !== "string" || !value) return;
				frames.push(makeFrame(id, joinBytes([new Uint8Array([3]), new TextEncoder().encode(value)])));
			};
			addTextFrame("TIT2", metadata.musicName);
			addTextFrame("TALB", metadata.album);
			if (Array.isArray(metadata.artist)) addTextFrame("TPE1", metadata.artist.map((artist) => artist[0]).filter(Boolean).join("/"));
			if (identifier) {
				const comment = joinBytes([new Uint8Array([3]), new TextEncoder().encode("eng"), new Uint8Array([0]), new TextEncoder().encode(identifier)]);
				frames.push(makeFrame("COMM", comment));
			}
			if (image?.length) {
				const isPng = image[0] === 0x89 && image[1] === 0x50 && image[2] === 0x4e && image[3] === 0x47;
				const picture = joinBytes([new Uint8Array([0]), new TextEncoder().encode(isPng ? "image/png" : "image/jpeg"), new Uint8Array([0, 3, 0]), image]);
				frames.push(makeFrame("APIC", picture));
			}
			if (!frames.length) return audio;
			const payload = joinBytes(frames);
			const header = new Uint8Array([0x49, 0x44, 0x33, 4, 0, 0, ...syncSafe(payload.length)]);
			return joinBytes([header, payload, audio]);
		}

		function makeFrame(id, payload) {
			return joinBytes([new TextEncoder().encode(id), syncSafe(payload.length), new Uint8Array([0, 0]), payload]);
		}

		function syncSafe(value) {
			return new Uint8Array([(value >> 21) & 0x7f, (value >> 14) & 0x7f, (value >> 7) & 0x7f, value & 0x7f]);
		}

		function joinBytes(parts) {
			const result = new Uint8Array(parts.reduce((total, part) => total + part.length, 0));
			let offset = 0;
			for (const part of parts) {
				result.set(part, offset);
				offset += part.length;
			}
			return result;
		}

		function hexBytes(hex) {
			return Uint8Array.from(hex.match(/.{2}/g), (part) => Number.parseInt(part, 16));
		}

		function downloadFile(blob, filename) {
			const url = URL.createObjectURL(blob);
			const link = document.createElement("a");
			link.href = url;
			link.download = filename;
			link.click();
			setTimeout(() => URL.revokeObjectURL(url), 1000);
		}
	</script>
